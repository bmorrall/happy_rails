<!-- "On this page" table of contents. Built from the h2 and h3 headings of each page. -->
<style>
  .page-toc {
    margin: 1rem 0 2rem;
    padding: 0.75rem 1rem;
    border-left: 3px solid #eeebee;
    font-size: 0.875rem !important;
  }
  .page-toc-title {
    margin: 0 0 0.5rem;
    color: #5c5962;
    font-size: 0.75rem !important;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .page-toc ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .page-toc li {
    margin: 0.25rem 0;
  }
  .page-toc li::before {
    content: none !important;
  }
  .page-toc .page-toc-h3 {
    padding-left: 1rem;
  }
  .page-toc a {
    color: #5c5962;
    text-decoration: none;
  }
  .page-toc a:hover,
  .page-toc a.active {
    color: #7253ed;
  }

  /* On wide screens, move the list into a sticky rail to the right of the content.
     The theme centres a 66.5rem sidebar + content block; centre an 82rem block
     instead, so the 15.5rem rail fits on laptop screens. */
  @media (min-width: 82rem) {
    .has-page-toc .side-bar {
      width: calc((100% - 82rem) / 2 + 16.5rem);
    }
    .has-page-toc .side-bar + .main {
      margin-left: Max(16.5rem, calc((100% - 82rem) / 2 + 16.5rem));
    }
    .page-toc {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 100%;
      width: 14rem;
      margin: 0;
      padding: 2rem 1rem 0 0;
      border-left: 0;
    }
    .page-toc-inner {
      position: sticky;
      top: 2rem;
      padding-left: 1rem;
      border-left: 1px solid #eeebee;
    }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var content = document.querySelector("#main-content main");
    if (!content) return;

    var headings = Array.prototype.filter.call(
      content.querySelectorAll("h2[id], h3[id]"),
      function (heading) { return !heading.classList.contains("no_toc"); }
    );
    if (headings.filter(function (h) { return h.tagName === "H2"; }).length < 2) return;

    var nav = document.createElement("nav");
    nav.className = "page-toc";
    nav.setAttribute("aria-labelledby", "page-toc-title");
    nav.innerHTML =
      '<div class="page-toc-inner"><p class="page-toc-title" id="page-toc-title">On this page</p><ul></ul></div>';
    var list = nav.querySelector("ul");
    document.body.classList.add("has-page-toc");

    var links = headings.map(function (heading) {
      var item = document.createElement("li");
      item.className = "page-toc-" + heading.tagName.toLowerCase();
      var link = document.createElement("a");
      link.href = "#" + heading.id;
      link.textContent = heading.textContent.trim();
      item.appendChild(link);
      list.appendChild(item);
      return link;
    });

    var title = content.querySelector("h1");
    var intro = title && title.nextElementSibling;
    if (intro && intro.tagName === "P") {
      intro.after(nav);
    } else if (title) {
      title.after(nav);
    } else {
      content.prepend(nav);
    }

    // Highlight the section the reader is in.
    function highlight() {
      var current = 0;
      headings.forEach(function (heading, index) {
        if (heading.getBoundingClientRect().top <= 80) current = index;
      });
      links.forEach(function (link, index) {
        link.classList.toggle("active", index === current);
      });
    }
    document.addEventListener("scroll", highlight, { passive: true });
    highlight();
  });
</script>
