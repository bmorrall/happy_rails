title: Happy Rails
description: How I structure my Rails apps, plus agent instructions you can drop into your own repo.
remote_theme: just-the-docs/just-the-docs@v0.10.1

# Used to build links to the instruction files on GitHub.
repository: bmorrall/happy_rails
branch: main

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

search_enabled: true
heading_anchors: true
color_scheme: light

aux_links:
  "View on GitHub":
    - "https://github.com/bmorrall/happy_rails"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/bmorrall/happy_rails"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
